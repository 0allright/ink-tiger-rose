    <h3>致 德昌</h3>
    <p>同一个农历七月廿八生，同窗四年，又在自动化青协并肩三年，很幸运能在大学生活认识你。新的一岁，愿你跑得稳、爬得高、挥拍照样利落，顺顺当当，开开心心。来日方长，好酒不急，等你下山，我们慢慢喝。</p>
    <div class="sign">——阿腾</div>
    <div class="date">丙午年七月廿八 · 2026.09.09</div>
    <div class="why">为何是虎？过江龙（蟒）恣意，翻云覆雨；凤凰决绝，向死而生；下山虎，威风凛凛，却一步一个脚印——像你：成熟稳健，有耐心，靠谱，有担当。这支虎纹笔，愿你落笔如虎下山；心有猛虎，细嗅蔷薇。</div>
    <div id="seal">虎</div>
  </div>

function rgb2hue(r,g,b){
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;
  if(d!==0){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;
    h*=60;if(h<0)h+=360;}
  return h;
}
function hueSprite(h,alpha,li){
  li=li||58;
  var c=document.createElement('canvas');c.width=c.height=32;
  var g=c.getContext('2d'),gr=g.createRadialGradient(16,16,1,16,16,15);
  gr.addColorStop(0,'rgba(255,250,230,'+alpha+')');
  gr.addColorStop(0.28,'hsla('+h+',88%,'+Math.min(80,li+10)+'%,'+alpha+')');
  gr.addColorStop(0.62,'hsla('+h+',85%,'+li+'%,'+alpha*0.5+')');
  gr.addColorStop(1,'hsla('+h+',85%,'+li+'%,0)');
  g.fillStyle=gr;g.beginPath();g.arc(16,16,15,0,6.3);g.fill();return c;
}

function nearestIdx(r,g2,b){

var N_ROSE=380;
function offscreen(w,h,draw){var c=document.createElement('canvas');c.width=w;c.height=h;
  var g=c.getContext('2d',{willReadFrequently:true});draw(g,w,h);return c;}

function sampleTiger(img,cimg){
  var W=img.naturalWidth,H=img.naturalHeight;
  var c=offscreen(W,H,function(g){g.drawImage(img,0,0);});
  var d=c.getContext('2d').getImageData(0,0,W,H).data;
  var cc=offscreen(cimg.naturalWidth,cimg.naturalHeight,function(g){g.drawImage(cimg,0,0);});
  var cd=cc.getContext('2d').getImageData(0,0,cc.width,cc.height).data;
  var arr=[],tot=0,x,y,i;
  for(y=0;y<H;y+=1)for(x=0;x<W;x+=1){i=(y*W+x)*4;
    var a=d[i]/255;
    if(a>0.08){
      var cx2=Math.min(cc.width-1,x/W*cc.width|0),cy2=Math.min(cc.height-1,y/H*cc.height|0);
      var j=(cy2*cc.width+cx2)*4;
      var wgt=40+a*a*130;
      if(x/W>0.57&&y/H>0.68)wgt*=1.8;   /* 虎首加密（嗅的焦点） */
      arr.push({x:x,y:y,w:wgt,a:a,
        si:nearestIdx(cd[j],cd[j+1],cd[j+2])});tot+=wgt;}}
  var pre=new Float64Array(arr.length+1);
  for(i=0;i<arr.length;i++)pre[i+1]=pre[i]+arr[i].w;
  var out=[],k;
  for(k=0;k<N_MAIN;k++){
    var r2=Math.random()*pre[arr.length],lo=0,hi=arr.length-1,mid;
    while(lo<hi){mid=(lo+hi)>>1;if(pre[mid+1]>=r2)hi=mid;else lo=mid+1;}
    var p=arr[lo];
    out.push({x:(p.x/W-0.5)*BOX_W,y:(0.5-p.y/H)*BOX_H,z:(Math.random()-0.5)*0.05,
      a:p.a,si:p.si});
  }
  return out;
}
function sampleText(){
  var W=880,H=560;
  var c=offscreen(W,H,function(g){
    g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#000';
    g.textAlign='center';g.textBaseline='middle';
    g.font='46px "Kaiti SC","KaiTi",serif';       g.fillText('亲 爱 的 德 昌 ：',W/2,68);
    g.font='bold 150px "Kaiti SC","KaiTi",serif'; g.fillText('生 日 快 乐',W/2,226);
    g.font='bold 96px "Kaiti SC","KaiTi",serif';  g.fillText('天 天 开 心',W/2,382);
    g.font='52px "Kaiti SC","KaiTi",serif';       g.fillText('——阿腾',W/2,486);
  });
  var d=c.getContext('2d').getImageData(0,0,W,H).data,arr=[],x,y,i;
  for(y=0;y<H;y+=1)for(x=0;x<W;x+=1){i=(y*W+x)*4;
    if(255-d[i]>46)arr.push({x:x,y:y});}
  var out=[],k,p;
  for(k=0;k<N_MAIN;k++){p=arr[Math.floor(Math.random()*arr.length)]||arr[0];
    out.push({x:(Math.random()-0.5)*0.045,y:(0.5-p.y/H)*LH+TDY,z:(p.x/W-0.5)*LZ,
      a:0.88+Math.random()*0.12,g:(Math.random()*3)|0});}
  return out;
}
function roseTargets(){
  /* 蔷薇：闭口后的鼻尖前方（画幅 95%,96%）→ 侧视落款下方；层叠蔷薇：花心+两圈花瓣（取色自真实蔷薇照片） */
  var mtx=(0.95-0.5)*BOX_W, mty=(0.5-0.96)*BOX_H;
  var T=[],L=[],k;
  var S=BOX_H*0.052;
  var rings=[
    {r0:0.00,r1:0.22,lobes:0,hue:349,li:34,pts:90},   /* 花心：深玫红 */
    {r0:0.18,r1:0.55,lobes:5,hue:347,li:46,pts:130},  /* 内圈五瓣 */
    {r0:0.50,r1:1.00,lobes:7,hue:344,li:58,pts:160}   /* 外圈七瓣，缘部浅粉 */
  ];
  var ri,ring;
  for(ri=0;ri<rings.length;ri++){
    ring=rings[ri];
    for(k=0;k<ring.pts;k++){
      var u=Math.random();
      var rr2=S*(ring.r0+(ring.r1-ring.r0)*u);
      var ang,spread;
      if(ring.lobes===0){ang=Math.random()*6.283;}
      else{
        var base=ri*2.4+Math.floor(Math.random()*ring.lobes)*(6.283/ring.lobes);
        spread=(6.283/ring.lobes)*(0.25+0.75*u);   /* 花瓣根部窄、缘部宽 */
        ang=base+(Math.random()-0.5)*spread;
      }
      rr2*=1+0.10*Math.sin(ang*ring.lobes+ri)+(Math.random()-0.5)*0.06; /* 缘部褶皱 */
      var li=Math.max(28,Math.min(66,ring.li+u*14-6+(Math.random()-0.5)*6));
      T.push({p:{x:8+(Math.random()-0.5)*0.1,   /* 正面待位于画外，随旋转飞入落款 */
                 y:-LH/2-0.12+TDY+Math.sin(ang)*rr2*0.8,
                 z:LZ/2-0.25+Math.cos(ang)*rr2*0.8},li:li});
      L.push({p:{x:(Math.random()-0.5)*0.05,
                 y:-LH/2-0.12+Math.sin(ang)*rr2*0.8,
                 z:LZ/2-0.25+Math.cos(ang)*rr2*0.8},li:li});
    }
  }
  return {T:T,L:L};
}

/* ====== 组装 ====== */
var PTS=[];
function assemble(){
  BOX_W=BOX_H*TIGER_IMG.naturalWidth/TIGER_IMG.naturalHeight; /* 画幅自动适配 */
  var sc0=Math.min(innerWidth/BOX_W,innerHeight/BOX_H);
  TDY=(innerHeight-BOX_H*sc0)*0.22/sc0;   /* 文字相对主体带上浮量(世界单位) */
  var TT=sampleTiger(TIGER_IMG,COLOR_IMG),LT=sampleText(),RO=roseTargets(),i;
  PTS=[];
  for(i=0;i<N_MAIN;i++){
    var tt=TT[i],ll=LT[i],d=Math.random()*0.3;
    var sz0=0.5+Math.pow(Math.random(),1.6)*1.15;
    if(Math.random()<0.04)sz0+=1.2;
    PTS.push({tx:tt.x,ty:tt.y,tz:tt.z,lx:ll.x,ly:ll.y,lz:ll.z,
      th:tt.a,lh:ll.a,
      ox:(Math.random()-0.5)*1.7,oy:(Math.random()-0.5)*1.4,oz:(Math.random()-0.5)*0.8,
      delay:d,birth:0.5+d*0.9,size:sz0,shade:tt.a,si:tt.si,g:ll.g||0,
      tw0:Math.random()*6.28,ts:0.6+Math.random()*1.1});
  }
  for(i=0;i<N_ROSE;i++){
    var rt=RO.T[i],rl=RO.L[i],d2=Math.random()*0.2+0.6;
    PTS.push({tx:rt.p.x,ty:rt.p.y,tz:rt.p.z,lx:rl.p.x,ly:rl.p.y,lz:rl.p.z,
      th:rt.h,lh:rt.h,rli:rt.li,
      ox:(Math.random()-0.5)*2.2,oy:(Math.random()-0.5)*1.8,oz:(Math.random()-0.5)*1.0,
      delay:d2,birth:0.8+d2*0.8,size:0.7+Math.random()*1.4,shade:1,rose:true,g:(Math.random()*3)|0,
      tw0:Math.random()*6.28,ts:0.6+Math.random()*1.1});
  }
}

/* ====== 状态与交互 ====== */
var yaw=0,pitch=-0.04,zoom=1,yawVel=0;
var mode='wait',T0=0,dragging=false,lastX=0,lastY=0;
var elBg=document.querySelector('.bg');
var elPoem=document.getElementById('poem'),elHint=document.getElementById('hint'),
    elBtn=document.getElementById('openBtn'),elCard=document.getElementById('card'),
    elPaper=document.getElementById('paper'),elSeal=document.getElementById('seal');
var cardOpen=false,cardBtnShown=false;
function easeIO(t){t=Math.max(0,Math.min(1,t));return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function smooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);}
function autoYaw(t){
  if(t<5.6)return 0;
  if(t<8.4)return easeIO((t-5.6)/2.8)*Math.PI/2;
  if(t<12.8)return Math.PI/2;
  if(t<15.6)return (1-easeIO((t-12.8)/2.8))*Math.PI/2;
  return 0;
}
function morphFromYaw(y){return smooth((Math.abs(y)*180/Math.PI-15)/60);}
function down(x,y){if(mode==='wait')return;mode='free';dragging=true;lastX=x;lastY=y;yawVel=0;}
function move(x,y){if(!dragging)return;
  var dx=x-lastX,dy=y-lastY;lastX=x;lastY=y;
  yaw+=dx*0.006;yawVel=dx*0.006;
  pitch=Math.max(-0.62,Math.min(0.62,pitch+dy*0.004));}
function up(){dragging=false;}
cv.addEventListener('mousedown',function(e){down(e.clientX,e.clientY);});
addEventListener('mousemove',function(e){move(e.clientX,e.clientY);});
addEventListener('mouseup',up);
cv.addEventListener('touchstart',function(e){if(e.touches.length===1)down(e.touches[0].clientX,e.touches[0].clientY);else dragging=false;e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',function(e){if(e.touches.length===1)move(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();},{passive:false});
cv.addEventListener('touchend',up);
cv.addEventListener('wheel',function(e){zoom=Math.max(0.6,Math.min(1.8,zoom*(e.deltaY>0?0.92:1.08)));e.preventDefault();},{passive:false});
var pinch0=0,zoom0=1;
cv.addEventListener('touchmove',function(e){if(e.touches.length===2){
  var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
  var d2=Math.sqrt(dx*dx+dy*dy);
  if(pinch0>0)zoom=Math.max(0.6,Math.min(1.8,zoom0*d2/pinch0));
  else{pinch0=d2;zoom0=zoom;}
}},{passive:false});
cv.addEventListener('touchend',function(){pinch0=0;});
elBtn.addEventListener('click',function(){
  cardOpen=true;elCard.style.display='flex';
  requestAnimationFrame(function(){elPaper.classList.add('show');
    setTimeout(function(){elSeal.classList.add('on');},650);});
});
document.getElementById('back').addEventListener('click',function(){
  cardOpen=false;elCard.style.display='none';elPaper.classList.remove('show');elSeal.classList.remove('on');
});

/* ====== 渲染 ====== */
var order=new Int32Array(N_MAIN+N_ROSE);
var lastT=0,skip=1,dtEMA=16;
function frame(now){
  var dt=now-lastT;lastT=now;dtEMA=dtEMA*0.95+dt*0.05;
  if(dtEMA>30&&skip<3)skip++;else if(dtEMA<19&&skip>1)skip--;
  var t=(now-T0)/1000;
  if(mode==='auto'){
    yaw=autoYaw(t);
    if(t>15.6)mode='free';
    if(t>9.0&&!cardBtnShown){cardBtnShown=true;elBtn.style.display='block';}
  }else{
    if(!dragging){yaw+=yawVel;yawVel*=0.93;}
  }
  var m=morphFromYaw(yaw);
  elBg.style.opacity=(1-m).toFixed(3);   /* 展示文字时竹林完全淡化 */
  var w=cv.width,h=cv.height,cx=w/2,cy=h/2,scale=Math.min(w/BOX_W,h/BOX_H)*zoom,
      OFFY=(h-BOX_H*scale)*0.22;   /* 主体带下落位（竹作背景，虎踞中低） */
  ctx.clearRect(0,0,w,h);
  if(t>0&&t<1.05){var p=Math.min(1,t/0.8),dr=(8+16*p)*DPR;
    ctx.globalAlpha=0.95;
    ctx.drawImage(GOLD[1],cx+30*DPR-dr,cy-320*DPR*(1-p*p)-dr,dr*2,dr*2);
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}
  var cyw=Math.cos(yaw),syw=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  var count=0,k,pt;
  for(k=0;k<PTS.length;k++){pt=PTS[k];
    if(t<=pt.birth)continue;
    var ph=Math.min(1,(t-pt.birth)/0.7);
    var lxp=smooth(Math.max(0,Math.min(1,m*1.3-pt.delay*0.3)));
    var bx=pt.tx+(pt.lx-pt.tx)*lxp, by=pt.ty+(pt.ly-pt.ty)*lxp, bz=pt.tz+(pt.lz-pt.tz)*lxp;
    if(ph<1){bx+=pt.ox*(1-ph);by+=pt.oy*(1-ph);bz+=pt.oz*(1-ph);}
    var x1=bx*cyw+bz*syw, z1=-bx*syw+bz*cyw;
    var y2=by*cp-z1*sp,  z2=by*sp+z1*cp;
    var df=6.0/(6.0-z2);
    var sx=cx+x1*scale*df, sy=cy+OFFY-y2*scale*df;
    if(sx<-40||sx>w+40||sy<-40||sy>h+40)continue;
    order[count]=k;
    PTS[k]._sx=sx;PTS[k]._sy=sy;PTS[k]._df=df;PTS[k]._z=z2;PTS[k]._lx=lxp;count++;
  }
  var view=order.subarray(0,count);
  view.sort(function(a,b){return PTS[a]._z-PTS[b]._z;});
  /* 水墨纪律：浅底禁用 lighter 加法混合 */
  for(k=0;k<count;k+=skip){
    pt=PTS[view[k]];
    var aVal=Math.max(0.05,pt.th+(pt.lh-pt.th)*pt._lx);
    var sz=pt.size*(0.95+pt.shade*0.35)*pt._df*DPR*(skip>1?1.6:1);
    var tw=0.87+0.13*Math.sin(now*0.0012*pt.ts+pt.tw0);
    ctx.globalAlpha=Math.max(0.22,Math.min(1,(0.55+(1-pt._z)*0.1)*tw));
    var spr=pt.rose?ROSEP[Math.min(2,Math.floor(pt.rli/24))]
        :(pt.g!==undefined&&pt._lx>0.5)?GOLD[pt.g]:NSP[pt.si];
    ctx.drawImage(spr,pt._sx-sz*1.5,pt._sy-sz*1.5,sz*3,sz*3);
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  var yawDeg=Math.abs(yaw)*180/Math.PI;
  elPoem.style.opacity=(mode==='auto'?(t>3.2&&t<5.4?0.92:(yawDeg<28?0.75:0)):(yawDeg<28?0.75:0));
  elHint.style.opacity=(cardOpen||(cardBtnShown&&t>9))?0:(mode==='auto'&&t>4.8?0.9:(mode==='free'?0.55:0));
  requestAnimationFrame(frame);
}

/* ====== 启动（图片就绪后开演） ====== */
var TIGER_IMG=new Image(),COLOR_IMG=new Image(),N_LOADED=0;
function startShow(){
  if(++N_LOADED<2)return;
  assemble();
  resize();
  T0=performance.now()+(location.hash==='#rec'?3000:0);lastT=T0;mode='auto';
  requestAnimationFrame(frame);
}
document.querySelector(".bg").style.backgroundImage="url("+BAMBOO_DATA+")";
TIGER_IMG.onload=startShow;COLOR_IMG.onload=startShow;
TIGER_IMG.src=TIGER_DATA;COLOR_IMG.src=COLOR_DATA;
})();
</script>
